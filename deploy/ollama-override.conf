# Install on Raspberry Pi 5 OS:
#   sudo mkdir -p /etc/systemd/system/ollama.service.d
#   sudo cp /opt/pi-smart-weather-station/deploy/ollama-override.conf /etc/systemd/system/ollama.service.d/override.conf
#   sudo systemctl daemon-reload && sudo systemctl restart ollama.service
#
# Pins Ollama 3B (qwen2.5:3b) to CPU cores 2-3 with Nice=10 and a 5G RAM cap so it
# never starves FastAPI, OpenCV optical flow, or Hailo-8 PCIe NPU inference on cores 0-1.

[Service]
Environment="OLLAMA_NUM_PARALLEL=1"
Environment="OLLAMA_MAX_LOADED_MODELS=1"
Environment="OLLAMA_KEEP_ALIVE=15m"
Nice=10
AllowedCPUs=2-3
MemoryMax=5G
